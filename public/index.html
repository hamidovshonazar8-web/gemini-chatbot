<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrapeGPT</title>
<meta name="description" content="GrapeGPT — sun'iy intellekt bilan suhbatlashish uchun chat yordamchisi." />
<meta name="google-site-verification" content="VkmVxzCVKFLD52cg87yLk6OURcpybIy5kmmfOX2nq_4" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a;
  }

  body {
    display: flex;
    overflow: hidden;
    background-image:
      linear-gradient(180deg, rgba(20,40,60,0.25) 0%, rgba(10,20,40,0.45) 100%),
      url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  /* ===== Glass panel base ===== */
  .glass {
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 270px;
    margin: 14px 0 14px 14px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: margin-left 0.25s;
    overflow: hidden;
  }
  .sidebar.collapsed { margin-left: -290px; }
  .sidebar-header { padding: 16px; }
  .new-chat-btn {
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 14px;
    color: #12213a;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .new-chat-btn:hover { background: rgba(255,255,255,0.55); }
  .chat-list { flex: 1; overflow-y: auto; padding: 4px 10px; }
  .chat-item {
    padding: 11px 12px;
    border-radius: 12px;
    font-size: 13px;
    color: #1a2b45;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 3px;
  }
  .chat-item:hover { background: rgba(255,255,255,0.3); }
  .chat-item.active { background: rgba(255,255,255,0.5); font-weight: 600; }
  .chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .delete-btn {
    opacity: 0;
    background: none;
    border: none;
    color: #33415e;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 5px;
    flex-shrink: 0;
  }
  .chat-item:hover .delete-btn { opacity: 1; }
  .chat-item .delete-btn:hover { color: #c0392b; }
  .sidebar-footer {
    padding: 14px 16px;
    font-size: 11px;
    color: #1a2b45;
    opacity: 0.7;
  }

  /* ===== MAIN AREA ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px; gap: 14px; }

  .header {
    padding: 14px 20px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 15px;
    color: #12213a;
    flex-shrink: 0;
  }
  .toggle-sidebar-btn {
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    color: #12213a;
    font-size: 16px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 10px;
  }
  .toggle-sidebar-btn:hover { background: rgba(255,255,255,0.55); }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    border-radius: 22px;
    padding: 24px 0;
  }
  .chat-inner { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: #17253f;
    gap: 12px;
    padding-top: 60px;
  }
  .welcome h1 { color: #0d1a30; font-size: 30px; font-weight: 700; text-shadow: 0 1px 12px rgba(255,255,255,0.4); }
  .welcome p { font-size: 14px; opacity: 0.85; }
  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 26px;
    width: 100%;
    max-width: 520px;
  }
  .suggestion {
    background: rgba(255,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    color: #12213a;
    transition: background 0.15s, transform 0.1s;
  }
  .suggestion:hover { background: rgba(255,255,255,0.5); transform: translateY(-1px); }

  .message { display: flex; gap: 14px; margin-bottom: 26px; line-height: 1.6; font-size: 15px; }
  .avatar-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.5);
  }
  .avatar-icon.user { background: rgba(255,255,255,0.4); }
  .avatar-icon.ai { background: linear-gradient(135deg, #4285f4, #9b72cb); border: none; }
  .msg-content {
    flex: 1;
    white-space: pre-wrap;
    word-wrap: break-word;
    padding: 10px 16px;
    border-radius: 16px;
    background: rgba(255,255,255,0.28);
    border: 1px solid rgba(255,255,255,0.4);
    color: #10192b;
  }
  .msg-content.loading .msg-text::after { content: "▍"; animation: blink 1s step-start infinite; }
  .msg-image { max-width: 280px; border-radius: 12px; margin-bottom: 8px; display: block; }
  @keyframes blink { 50% { opacity: 0; } }

  .input-area { flex-shrink: 0; }
  .image-preview-bar { max-width: 720px; margin: 0 auto 10px auto; display: none; padding: 0 20px; }
  .image-preview-bar.show { display: flex; }
  .image-preview-wrap { position: relative; display: inline-block; }
  .image-preview-wrap img { height: 60px; border-radius: 10px; display: block; border: 1px solid rgba(255,255,255,0.5); }
  .image-preview-wrap .remove-img {
    position: absolute;
    top: -6px;
    right: -6px;
    background: rgba(30,30,30,0.8);
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .input-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 999px;
    padding: 10px 10px 10px 18px;
  }
  .attach-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    color: #12213a;
    transition: background 0.15s;
  }
  .attach-btn:hover { background: rgba(255,255,255,0.55); }
  .mic-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    color: #12213a;
    transition: background 0.15s;
  }
  .mic-btn:hover { background: rgba(255,255,255,0.55); }
  .mic-btn.recording { background: #e74c3c; color: #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); } 50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); } }
  .voice-mode-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4285f4, #6aa8ff);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 17px;
    color: #fff;
    box-shadow: 0 4px 14px rgba(66,133,244,0.45);
    transition: transform 0.1s;
  }
  .voice-mode-btn:hover { transform: scale(1.05); }
  .voice-mode-btn.active { background: linear-gradient(135deg, #e74c3c, #ff7b6a); animation: pulse2 1.2s infinite; }
  @keyframes pulse2 { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); } 50% { box-shadow: 0 0 0 10px rgba(231,76,60,0); } }
  .voice-mode-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 26px;
    z-index: 50;
  }
  .voice-mode-overlay.show { display: flex; }
  .voice-orb {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,0.95) 0%, rgba(190,225,255,0.7) 22%, rgba(120,190,255,0.55) 45%, rgba(60,130,220,0.4) 68%, rgba(20,60,120,0.25) 100%);
    filter: blur(0.5px);
    box-shadow: 0 0 70px rgba(100,170,255,0.35), inset 0 0 40px rgba(255,255,255,0.25);
    animation: orb-idle 4s ease-in-out infinite;
    overflow: hidden;
  }
  .voice-orb::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 65% 70%, rgba(255,255,255,0.5) 0%, transparent 35%),
      radial-gradient(circle at 25% 75%, rgba(150,210,255,0.4) 0%, transparent 40%);
    animation: orb-swirl 6s ease-in-out infinite;
  }
  .voice-orb.listening { animation: orb-listen 1.2s ease-in-out infinite; }
  .voice-orb.speaking { animation: orb-speak 0.7s ease-in-out infinite; }
  @keyframes orb-idle { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @keyframes orb-swirl { 0%,100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(15deg) scale(1.08); } }
  @keyframes orb-listen { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes orb-speak { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .voice-name { color: #fff; font-size: 20px; font-weight: 600; margin-top: 4px; }
  .voice-status { color: rgba(255,255,255,0.65); font-size: 14px; font-weight: 400; }
  .voice-close-btn {
    position: absolute;
    bottom: 60px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voice-close-btn:hover { background: rgba(255,255,255,0.2); }
  .voice-lang-bar {
    position: absolute;
    top: 50px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px;
  }
  .voice-lang-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 15px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .voice-lang-btn:hover { background: rgba(255,255,255,0.2); }
  .voice-lang-btn.active { background: rgba(255,255,255,0.9); color: #12213a; border-color: rgba(255,255,255,0.9); }
  .file-chip-bar {
    max-width: 720px;
    margin: 0 auto 10px auto;
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px;
  }
  .file-chip-bar.show { display: flex; }
  .file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 12px;
    padding: 7px 10px;
    font-size: 12px;
    color: #12213a;
  }
  .file-chip .file-icon { font-size: 14px; }
  .file-chip .file-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .remove-file {
    background: none;
    border: none;
    color: #33415e;
    cursor: pointer;
    font-size: 13px;
    padding: 0;
    line-height: 1;
  }
  .file-chip .remove-file:hover { color: #c0392b; }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #0d1a30;
    font-size: 15px;
    resize: none;
    max-height: 150px;
    font-family: inherit;
    padding: 8px 0;
  }
  textarea::placeholder { color: #33415e; opacity: 0.75; }
  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4285f4, #6aa8ff);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 17px;
    color: #fff;
    box-shadow: 0 4px 14px rgba(66,133,244,0.45);
    transition: transform 0.1s;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { background: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); box-shadow: none; cursor: not-allowed; }
  .footer-note { text-align: center; font-size: 11px; color: #f0f4fa; opacity: 0.8; margin-top: 10px; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }

  .error-box {
    background: rgba(120, 30, 30, 0.35);
    border: 1px solid rgba(255,120,120,0.5);
    color: #ffe3e3;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== Auth (Sign up / Login) ===== */
  .auth-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,40,60,0.55) 0%, rgba(10,20,40,0.75) 100%),
      url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .auth-card {
    width: 100%;
    max-width: 360px;
    margin: 20px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .auth-title { font-size: 22px; font-weight: 700; color: #12213a; text-align: center; margin-bottom: 6px; }
  .auth-subtitle { font-size: 13px; color: #4a5872; text-align: center; margin-bottom: 22px; }
  .auth-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.12);
    background: rgba(255,255,255,0.7);
    font-size: 14px;
    color: #12213a;
    margin-bottom: 12px;
    outline: none;
  }
  .auth-input:focus { border-color: #4285f4; }
  .auth-btn-primary {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #4285f4, #6aa8ff);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .auth-btn-primary:hover { opacity: 0.92; }
  .auth-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-toggle {
    text-align: center;
    font-size: 13px;
    color: #33415e;
    margin-top: 16px;
  }
  .auth-toggle a { color: #4285f4; font-weight: 600; text-decoration: none; cursor: pointer; }
  .auth-error {
    background: rgba(231,76,60,0.15);
    color: #c0392b;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    margin-bottom: 12px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-success {
    background: rgba(52,168,83,0.15);
    color: #1e7e34;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    margin-bottom: 12px;
    display: none;
  }
  .auth-success.show { display: block; }

  .user-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    margin: 0 10px 10px 10px;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 14px;
    font-size: 12px;
    color: #12213a;
  }
  .user-bar .user-email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
  .user-bar .logout-btn {
    background: none;
    border: none;
    color: #33415e;
    cursor: pointer;
    font-size: 12px;
    text-decoration: underline;
    flex-shrink: 0;
  }
  .usage-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(66,133,244,0.18);
    color: #1a4fb4;
    font-weight: 600;
    flex-shrink: 0;
  }
  .usage-badge.premium { background: rgba(244,180,0,0.25); color: #8a5a00; }
  .usage-badge.low { background: rgba(231,76,60,0.2); color: #c0392b; }

  .premium-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,15,25,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 90;
  }
  .premium-modal-overlay.show { display: flex; }
  .premium-modal {
    width: 100%;
    max-width: 340px;
    margin: 20px;
    background: rgba(255,255,255,0.92);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
  }
  .premium-modal h3 { font-size: 19px; color: #12213a; margin-bottom: 10px; }
  .premium-modal p { font-size: 13.5px; color: #4a5872; margin-bottom: 20px; line-height: 1.5; }
  .premium-modal .close-modal-btn {
    background: rgba(0,0,0,0.06);
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    color: #33415e;
    cursor: pointer;
    margin-top: 6px;
  }
</style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="auth-title" id="authTitle">Xush kelibsiz</div>
      <div class="auth-subtitle" id="authSubtitle">GrapeGPT'ga kirish uchun tizimga kiring</div>
      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>
      <input type="email" class="auth-input" id="authEmail" placeholder="Email manzilingiz" autocomplete="email">
      <input type="password" class="auth-input" id="authPassword" placeholder="Parol" autocomplete="current-password">
      <button class="auth-btn-primary" id="authSubmitBtn">Kirish</button>
      <div class="auth-toggle" id="authToggleText">
        Hisobingiz yo'qmi? <a id="authToggleLink">Ro'yxatdan o'tish</a>
      </div>
    </div>
  </div>

  <div class="premium-modal-overlay" id="premiumModalOverlay">
    <div class="premium-modal">
      <h3>Kunlik limit tugadi</h3>
      <p id="premiumModalText">Bepul kunlik xabarlar limitiga yetdingiz. Premium olib, cheklovsiz suhbatlashing.</p>
      <button class="close-modal-btn" id="closePremiumModalBtn">Yopish</button>
    </div>
  </div>

  <div class="sidebar glass" id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="newChatBtn">✚ Yangi suhbat</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="user-bar" id="userBar" style="display:none;">
      <span class="user-email" id="userEmailLabel"></span>
      <span class="usage-badge" id="usageBadge"></span>
      <button class="logout-btn" id="logoutBtn">Chiqish</button>
    </div>
    <div class="sidebar-footer">Gemini API asosida</div>
  </div>

  <div class="main">
    <div class="header glass">
      <button class="toggle-sidebar-btn" id="toggleSidebarBtn">☰</button>
      🤖 Mening AI Chatim
    </div>

    <div class="chat-container glass" id="chatContainer">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="input-area">
      <div class="image-preview-bar" id="imagePreviewBar"></div>
      <div class="file-chip-bar" id="fileChipBar"></div>
      <div class="input-inner glass">
        <button class="attach-btn" id="attachBtn" title="Fayl yuklash">📎</button>
        <input type="file" id="fileInput" accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.java,.c,.cpp,.cs,.go,.rb,.php,.html,.css,.sh,.yaml,.yml,.xml,.sql,.log" style="display:none">
        <button class="mic-btn" id="micBtn" title="Ovozli kiritish">🎤</button>
        <textarea id="userInput" placeholder="Xabar yozing..." rows="1"></textarea>
        <button class="voice-mode-btn" id="voiceModeBtn" title="Ovozli suhbat">🎙️</button>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
      <div class="footer-note">Gemini API asosida ishlaydi</div>
    </div>
  </div>

  <div class="voice-mode-overlay" id="voiceModeOverlay">
    <div class="voice-lang-bar" id="voiceLangBar">
      <button class="voice-lang-btn active" data-lang="uz-UZ">O'zbek</button>
      <button class="voice-lang-btn" data-lang="ru-RU">Русский</button>
      <button class="voice-lang-btn" data-lang="en-US">English</button>
      <button class="voice-lang-btn" data-lang="tr-TR">Türkçe</button>
    </div>
    <div class="voice-orb" id="voiceOrb"></div>
    <div class="voice-name">GrapeGPT</div>
    <div class="voice-status" id="voiceStatus">Tinglayapman...</div>
    <button class="voice-close-btn" id="voiceCloseBtn" title="Yopish">✕</button>
  </div>

<script>
  // ===== Supabase sozlamalari =====
  const SUPABASE_URL = 'https://bmrdkyuxrogqvzyusvgh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_11fZD7ow6snFr17y8av8qg_Xiyl9BSA';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STORAGE_KEY = 'gemini_chats_v1';

  const sidebar = document.getElementById('sidebar');
  const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatListEl = document.getElementById('chatList');
  const chatContainer = document.getElementById('chatContainer');
  const chatInner = document.getElementById('chatInner');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewBar = document.getElementById('imagePreviewBar');
  const fileChipBar = document.getElementById('fileChipBar');
  const micBtn = document.getElementById('micBtn');

  // ===== Auth elementlari =====
  const authOverlay = document.getElementById('authOverlay');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const authError = document.getElementById('authError');
  const authSuccess = document.getElementById('authSuccess');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const authToggleText = document.getElementById('authToggleText');
  const authToggleLink = document.getElementById('authToggleLink');
  const userBar = document.getElementById('userBar');
  const userEmailLabel = document.getElementById('userEmailLabel');
  const usageBadge = document.getElementById('usageBadge');
  const logoutBtn = document.getElementById('logoutBtn');
  const premiumModalOverlay = document.getElementById('premiumModalOverlay');
  const closePremiumModalBtn = document.getElementById('closePremiumModalBtn');

  let isSignUpMode = false;
  let currentSession = null;

  function showAuthError(msg) {
    authError.textContent = msg;
    authError.classList.add('show');
    authSuccess.classList.remove('show');
  }
  function showAuthSuccess(msg) {
    authSuccess.textContent = msg;
    authSuccess.classList.add('show');
    authError.classList.remove('show');
  }
  function clearAuthMessages() {
    authError.classList.remove('show');
    authSuccess.classList.remove('show');
  }

  authToggleLink.addEventListener('click', () => {
    isSignUpMode = !isSignUpMode;
    clearAuthMessages();
    if (isSignUpMode) {
      authTitle.textContent = "Ro'yxatdan o'tish";
      authSubtitle.textContent = "Yangi hisob yaratib, GrapeGPT'dan foydalaning";
      authSubmitBtn.textContent = "Ro'yxatdan o'tish";
      authToggleText.innerHTML = 'Hisobingiz bormi? <a id="authToggleLink">Kirish</a>';
    } else {
      authTitle.textContent = "Xush kelibsiz";
      authSubtitle.textContent = "GrapeGPT'ga kirish uchun tizimga kiring";
      authSubmitBtn.textContent = "Kirish";
      authToggleText.innerHTML = "Hisobingiz yo'qmi? <a id=\"authToggleLink\">Ro'yxatdan o'tish</a>";
    }
    document.getElementById('authToggleLink').addEventListener('click', () => authToggleLink.click());
  });

  authSubmitBtn.addEventListener('click', async () => {
    clearAuthMessages();
    const email = authEmail.value.trim();
    const password = authPassword.value;

    if (!email || !password) {
      showAuthError("Iltimos, email va parolni to'ldiring");
      return;
    }
    if (password.length < 6) {
      showAuthError("Parol kamida 6 belgidan iborat bo'lishi kerak");
      return;
    }

    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = '...';

    try {
      if (isSignUpMode) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          currentSession = data.session;
          onAuthSuccess();
        } else {
          showAuthSuccess("Ro'yxatdan o'tdingiz! Endi 'Kirish' orqali tizimga kiring.");
          isSignUpMode = false;
          authToggleLink.click();
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentSession = data.session;
        onAuthSuccess();
      }
    } catch (err) {
      showAuthError(err.message || "Xatolik yuz berdi, qayta urinib ko'ring");
    } finally {
      authSubmitBtn.disabled = false;
      authSubmitBtn.textContent = isSignUpMode ? "Ro'yxatdan o'tish" : "Kirish";
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    currentSession = null;
    location.reload();
  });

  closePremiumModalBtn.addEventListener('click', () => {
    premiumModalOverlay.classList.remove('show');
  });

  function showPremiumModal(message) {
    if (message) document.getElementById('premiumModalText').textContent = message;
    premiumModalOverlay.classList.add('show');
  }

  async function refreshUsageBadge() {
    if (!currentSession) return;
    try {
      const res = await fetch('/api/usage', {
        headers: { 'Authorization': `Bearer ${currentSession.access_token}` }
      });
      const data = await res.json();
      if (data.isPremium) {
        usageBadge.textContent = '⭐ Premium';
        usageBadge.className = 'usage-badge premium';
      } else {
        usageBadge.textContent = `${data.remaining}/${data.limit} xabar`;
        usageBadge.className = 'usage-badge' + (data.remaining <= 3 ? ' low' : '');
      }
    } catch (e) { /* jim */ }
  }

  function onAuthSuccess() {
    authOverlay.style.display = 'none';
    userBar.style.display = 'flex';
    userEmailLabel.textContent = currentSession.user.email;
    refreshUsageBadge();
  }

  async function initAuth() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      currentSession = data.session;
      onAuthSuccess();
    } else {
      authOverlay.style.display = 'flex';
      userBar.style.display = 'none';
    }
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentSession = session;
  });

  initAuth();

  const WELCOME_HTML = `
    <div class="welcome" id="welcome">
      <h1>Sizga qanday yordam bera olaman?</h1>
      <p>Savolingizni yozing, rasm yuklang yoki quyidagilardan birini tanlang</p>
      <div class="suggestions">
        <div class="suggestion" data-prompt="O'zbekiston tarixi haqida qisqacha ayt">📖 O'zbekiston tarixi haqida qisqacha ayt</div>
        <div class="suggestion" data-prompt="Python'da 'Salom Dunyo' dasturini yoz">💻 Python'da 'Salom Dunyo' dasturini yoz</div>
        <div class="suggestion" data-prompt="Sog'lom ovqatlanish bo'yicha maslahat ber">🥗 Sog'lom ovqatlanish bo'yicha maslahat ber</div>
        <div class="suggestion" data-prompt="Motivatsion qisqa gap yoz">✨ Motivatsion qisqa gap yoz</div>
      </div>
    </div>`;

  let chats = loadChats();
  let activeChatId = chats.length > 0 ? chats[0].id : null;
  let pendingImage = null;
  let pendingFiles = [];
  let isStreaming = false;

  // Ovozlarni oldindan yuklab qo'yamiz (tezlik uchun)
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      window.speechSynthesis.getVoices();
    });
  }

  function loadChats() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveChats() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
  }

  function createNewChat() {
    const chat = { id: Date.now().toString(), title: 'Yangi suhbat', messages: [] };
    chats.unshift(chat);
    activeChatId = chat.id;
    saveChats();
    renderChatList();
    renderActiveChat();
  }

  function getActiveChat() {
    return chats.find(c => c.id === activeChatId);
  }

  function deleteChat(id, e) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    if (activeChatId === id) activeChatId = chats.length > 0 ? chats[0].id : null;
    saveChats();
    renderChatList();
    renderActiveChat();
  }

  function selectChat(id) {
    activeChatId = id;
    renderChatList();
    renderActiveChat();
  }

  function renderChatList() {
    chatListEl.innerHTML = '';
    chats.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');
      item.innerHTML = `<span class="title"></span><button class="delete-btn">✕</button>`;
      item.querySelector('.title').textContent = chat.title;
      item.addEventListener('click', () => selectChat(chat.id));
      item.querySelector('.delete-btn').addEventListener('click', (e) => deleteChat(chat.id, e));
      chatListEl.appendChild(item);
    });
  }

  function renderActiveChat() {
    chatInner.innerHTML = '';
    const chat = getActiveChat();
    if (!chat || chat.messages.length === 0) {
      chatInner.innerHTML = WELCOME_HTML;
      attachSuggestionHandlers();
      return;
    }
    chat.messages.forEach(m => renderMessageEl(m.role, m.text, m.image));
    scrollToBottom();
  }

  function attachSuggestionHandlers() {
    document.querySelectorAll('.suggestion').forEach(el => {
      el.addEventListener('click', () => {
        userInput.value = el.dataset.prompt;
        sendMessage();
      });
    });
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function renderMessageEl(role, text, image) {
    const welcomeEl = document.getElementById('welcome');
    if (welcomeEl) welcomeEl.remove();

    const div = document.createElement('div');
    div.className = 'message';
    const isUser = role === 'user';
    let imgHtml = '';
    if (image) imgHtml = `<img class="msg-image" src="${image}">`;
    div.innerHTML = `
      <div class="avatar-icon ${isUser ? 'user' : 'ai'}">${isUser ? '🙂' : '✦'}</div>
      <div class="msg-content">${imgHtml}<span class="msg-text"></span></div>
    `;
    div.querySelector('.msg-text').textContent = text || '';
    chatInner.appendChild(div);
    return div.querySelector('.msg-content');
  }

  function renderError(message) {
    const box = document.createElement('div');
    box.className = 'error-box';
    box.textContent = '⚠️ Xatolik: ' + message;
    chatInner.appendChild(box);
    scrollToBottom();
  }

  toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
  newChatBtn.addEventListener('click', createNewChat);

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;

    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = reader.result;
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    } else {
      const reader = new FileReader();
      reader.onload = () => {
        pendingFiles.push({ name: file.name, content: reader.result });
        renderFileChips();
      };
      reader.readAsText(file);
    }
    fileInput.value = '';
  });

  function renderFileChips() {
    if (pendingFiles.length === 0) {
      fileChipBar.classList.remove('show');
      fileChipBar.innerHTML = '';
      return;
    }
    fileChipBar.classList.add('show');
    fileChipBar.innerHTML = pendingFiles.map((f, i) => `
      <div class="file-chip">
        <span class="file-icon">📄</span>
        <span class="file-name">${f.name}</span>
        <button class="remove-file" data-idx="${i}">✕</button>
      </div>
    `).join('');
    fileChipBar.querySelectorAll('.remove-file').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingFiles.splice(Number(btn.dataset.idx), 1);
        renderFileChips();
      });
    });
  }

  // ===== Ovozli kiritish (Speech-to-Text) =====
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'uz-UZ';

    let baseText = '';

    recognition.addEventListener('start', () => {
      isRecording = true;
      micBtn.classList.add('recording');
      baseText = userInput.value ? userInput.value + ' ' : '';
    });

    recognition.addEventListener('result', (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += transcript;
        else interim += transcript;
      }
      userInput.value = baseText + final + interim;
      if (final) baseText += final;
      userInput.dispatchEvent(new Event('input'));
    });

    recognition.addEventListener('end', () => {
      isRecording = false;
      micBtn.classList.remove('recording');
    });

    recognition.addEventListener('error', () => {
      isRecording = false;
      micBtn.classList.remove('recording');
    });

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch (e) { /* ignore */ }
      }
    });
  } else {
    micBtn.style.display = 'none';
  }

  // ===== Ovozli suhbat rejimi (Voice Mode - eshitib, ovoz bilan javob beradi) =====
  const voiceModeBtn = document.getElementById('voiceModeBtn');
  const voiceModeOverlay = document.getElementById('voiceModeOverlay');
  const voiceOrb = document.getElementById('voiceOrb');
  const voiceStatus = document.getElementById('voiceStatus');
  const voiceCloseBtn = document.getElementById('voiceCloseBtn');
  const voiceLangBtns = document.querySelectorAll('.voice-lang-btn');

  let voiceModeActive = false;
  let voiceRecognition = null;
  let bargeInRecognition = null;
  let isAiSpeaking = false;
  let selectedVoiceLang = 'uz-UZ';
  let voiceCache = {};

  voiceLangBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      voiceLangBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedVoiceLang = btn.dataset.lang;
    });
  });

  // Tanlangan tilga mos ovozni bir marta topib, keshda saqlaymiz — tezlik uchun
  function pickVoiceForLang(langCode) {
    if (voiceCache[langCode]) return voiceCache[langCode];
    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) return null;
    const base = langCode.split('-')[0].toLowerCase();
    let found = voices.find(v => v.lang && v.lang.toLowerCase() === langCode.toLowerCase());
    if (!found) found = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(base));
    if (!found) found = voices[0];
    voiceCache[langCode] = found;
    return found;
  }

  function speakText(text) {
    if (!('speechSynthesis' in window) || !text) {
      if (voiceModeActive) startVoiceListening();
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voice = pickVoiceForLang(selectedVoiceLang);
    if (voice) utterance.voice = voice;
    utterance.lang = selectedVoiceLang;
    utterance.rate = 1.05;
    utterance.pitch = 1;

    utterance.onstart = () => {
      isAiSpeaking = true;
      voiceOrb.className = 'voice-orb speaking';
      voiceStatus.textContent = 'Gapiryapman...';
      startBargeInWatcher();
    };
    utterance.onend = () => {
      isAiSpeaking = false;
      stopBargeInWatcher();
      if (voiceModeActive) startVoiceListening();
    };
    window.speechSynthesis.speak(utterance);
  }

  // Foydalanuvchi AI gapirayotganda gapira boshlasa — darhol to'xtatadi
  function startBargeInWatcher() {
    if (!SpeechRecognitionAPI) return;
    stopBargeInWatcher();
    bargeInRecognition = new SpeechRecognitionAPI();
    bargeInRecognition.lang = selectedVoiceLang;
    bargeInRecognition.continuous = true;
    bargeInRecognition.interimResults = true;

    bargeInRecognition.addEventListener('result', (e) => {
      const last = e.results[e.results.length - 1];
      const transcript = last[0].transcript.trim();
      if (transcript.length > 1 && isAiSpeaking) {
        window.speechSynthesis.cancel();
        isAiSpeaking = false;
        stopBargeInWatcher();
        startVoiceListening();
      }
    });

    bargeInRecognition.addEventListener('error', () => {});
    bargeInRecognition.addEventListener('end', () => {});

    try { bargeInRecognition.start(); } catch (e) { /* ignore */ }
  }

  function stopBargeInWatcher() {
    if (bargeInRecognition) {
      try { bargeInRecognition.stop(); } catch (e) {}
      bargeInRecognition = null;
    }
  }

  function startVoiceListening() {
    if (!SpeechRecognitionAPI) return;
    stopBargeInWatcher();
    voiceOrb.className = 'voice-orb listening';
    voiceStatus.textContent = 'Tinglayapman...';

    voiceRecognition = new SpeechRecognitionAPI();
    voiceRecognition.lang = selectedVoiceLang;
    voiceRecognition.continuous = false;
    voiceRecognition.interimResults = false;

    voiceRecognition.addEventListener('result', (e) => {
      const transcript = e.results[0][0].transcript;
      if (transcript && transcript.trim()) {
        voiceStatus.textContent = transcript;
        userInput.value = transcript;
        sendVoiceMessage();
      } else if (voiceModeActive) {
        startVoiceListening();
      }
    });

    voiceRecognition.addEventListener('error', () => {
      if (voiceModeActive) {
        setTimeout(() => { if (voiceModeActive) startVoiceListening(); }, 600);
      }
    });

    try { voiceRecognition.start(); } catch (e) { /* ignore */ }
  }

  async function sendVoiceMessage() {
    voiceOrb.className = 'voice-orb';
    voiceStatus.textContent = 'O\'ylayapman...';
    await sendMessage(true);
  }

  voiceModeBtn.addEventListener('click', () => {
    voiceModeActive = true;
    voiceModeOverlay.classList.add('show');
    startVoiceListening();
  });

  voiceCloseBtn.addEventListener('click', () => {
    voiceModeActive = false;
    isAiSpeaking = false;
    voiceModeOverlay.classList.remove('show');
    window.speechSynthesis.cancel();
    stopBargeInWatcher();
    if (voiceRecognition) { try { voiceRecognition.stop(); } catch (e) {} }
  });

  function renderImagePreview() {
    if (!pendingImage) {
      imagePreviewBar.classList.remove('show');
      imagePreviewBar.innerHTML = '';
      return;
    }
    imagePreviewBar.classList.add('show');
    imagePreviewBar.innerHTML = `
      <div class="image-preview-wrap">
        <img src="${pendingImage}">
        <button class="remove-img" id="removeImgBtn">✕</button>
      </div>
    `;
    document.getElementById('removeImgBtn').addEventListener('click', () => {
      pendingImage = null;
      renderImagePreview();
    });
  }

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
  });

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage(isVoice) {
    if (!currentSession) {
      authOverlay.style.display = 'flex';
      return;
    }

    const text = userInput.value.trim();
    if ((!text && !pendingImage) || isStreaming) return;

    if (!activeChatId) createNewChat();
    const chat = getActiveChat();

    const imageToSend = pendingImage;
    const filesToSend = pendingFiles.slice();
    userInput.value = '';
    userInput.style.height = 'auto';
    pendingImage = null;
    pendingFiles = [];
    renderImagePreview();
    renderFileChips();

    let fullText = text;
    if (filesToSend.length > 0) {
      const filesBlock = filesToSend.map(f => `\n\n--- Fayl: ${f.name} ---\n${f.content}`).join('');
      fullText = (text ? text : 'Quyidagi fayl(lar)ni ko\'rib chiqing:') + filesBlock;
    }

    const displayText = filesToSend.length > 0
      ? (text ? text + '\n' : '') + filesToSend.map(f => `📄 ${f.name}`).join('  ')
      : text;

    renderMessageEl('user', displayText, imageToSend);
    chat.messages.push({ role: 'user', text: fullText, image: imageToSend || undefined });

    if (chat.messages.length === 1) {
      chat.title = (text || (imageToSend ? 'Rasm bilan suhbat' : 'Fayl bilan suhbat')).slice(0, 40);
      renderChatList();
    }
    saveChats();
    scrollToBottom();

    const aiContentEl = renderMessageEl('assistant', '');
    aiContentEl.classList.add('loading');
    const aiTextEl = aiContentEl.querySelector('.msg-text');

    isStreaming = true;
    sendBtn.disabled = true;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`
        },
        body: JSON.stringify({ messages: chat.messages })
      });

      if (response.status === 429) {
        const errData = await response.json().catch(() => ({}));
        aiContentEl.classList.remove('loading');
        aiContentEl.parentElement.remove();
        chat.messages.pop();
        saveChats();
        showPremiumModal(errData.message);
        return;
      }

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error || `Server xatosi: ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const jsonStr = line.slice(6);
          try {
            const data = JSON.parse(jsonStr);
            if (data.text) {
              fullText += data.text;
              aiTextEl.textContent = fullText;
              scrollToBottom();
            }
            if (data.done) aiContentEl.classList.remove('loading');
          } catch (e) { /* o'tkazib yuboramiz */ }
        }
      }

      aiContentEl.classList.remove('loading');
      chat.messages.push({ role: 'assistant', text: fullText });
      saveChats();
      refreshUsageBadge();

      if (isVoice && voiceModeActive) {
        speakText(fullText);
      }

    } catch (err) {
      aiContentEl.classList.remove('loading');
      aiContentEl.parentElement.remove();
      renderError(err.message);
      if (isVoice && voiceModeActive) {
        voiceStatus.textContent = 'Xatolik yuz berdi, qayta urinib ko\'ring';
        setTimeout(() => { if (voiceModeActive) startVoiceListening(); }, 1200);
      }
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  if (chats.length === 0) {
    createNewChat();
  } else {
    renderChatList();
    renderActiveChat();
  }
</script>

</body>
</html>
